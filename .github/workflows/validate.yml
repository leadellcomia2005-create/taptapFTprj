name: Validate website

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck --prefix client
      - run: npm run lint --prefix client
      - run: npm run test:policy --prefix client
      - run: npm run check:cycles
      - run: npm run check:operations-docs
      - run: npm run audit:production
      - run: npm run build --prefix client
      - run: npm run performance:check --prefix client
      - run: npm run smoke:preview --prefix client
      - run: npm run test --prefix server
      - run: npm run test:rules
      - run: npm run test:e2e:pwa
        env:
          CI: true
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            database-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
