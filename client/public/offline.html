<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c9362a" />
    <title>TapTap Foodtrip is offline</title>
    <style>
      :root {
        color: #241a16;
        background: #fff8ef;
        font-family: Inter, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 520px);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      p {
        color: #6d5e55;
        font-size: 16px;
        line-height: 1.6;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: Georgia, serif;
        font-size: clamp(36px, 10vw, 54px);
        line-height: 1;
      }
      a {
        min-height: 48px;
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border-radius: 8px;
        color: #fff;
        background: #c9362a;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #f5bd3e;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main id="offline-page">
      <img src="/assets/taptap-logo.webp" alt="TapTap Foodtrip" width="88" height="88" />
      <h1>You are offline</h1>
      <p>Reconnect to the internet, then return to TapTap Foodtrip. Orders, payments, dashboards, and private records are never served from an offline cache.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
